# Source list for the aggregator. Two adapter families, one interface.
#
#   A. Aggregator boards (himalayas, remotive) — whole-board feeds that carry
#      candidate-eligibility metadata. No board token; they take `queries`,
#      each entry being one set of API params to sweep.
#   B. Curated ATS (greenhouse, lever, ashby) — one board per company, keyed by
#      `token_or_slug`. Pre-vetted employers that hire from India and pay USD.
#
# How to find `token_or_slug`:
#   greenhouse -> the token in boards.greenhouse.io/<token> or job-boards.greenhouse.io/<token>
#   lever      -> the slug in jobs.lever.co/<slug>
#   ashby      -> the slug in jobs.ashbyhq.com/<slug>
#
# Eligibility inputs the feeds cannot supply:
#   us_employer            -> `is_us_employer` for the pay rule. Set it only
#                             where it is actually true; the filter treats
#                             unknown (unset) differently from false.
#   location_eligibility   -> fallback candidate-eligibility, used ONLY when a
#                             posting's own location strings resolve to nothing.
#
# Every entry below was verified live (job counts as of 2026-08-03).
# Run `python -m scripts.verify_endpoints` to re-check at any time.

companies:
  # --- Aggregator boards (primary discovery) -------------------------------
  - company: Himalayas
    ats: himalayas
    careers_url: https://himalayas.app/jobs
    # Two axes, multiplied out. No single query covers both halves of the
    # location rule (`worldwide=true` returns unrestricted roles, `country=India`
    # returns India-eligible ones), and `q` matches one phrase at a time.
    # Results merge into one board and are de-duplicated by job, so a job
    # matching several queries is stored once.
    #
    # `seniority` is the API-level half of the role filter — entry-level rows
    # are never fetched, so they cost nothing to store or re-score. Verified
    # live: the param accepts a comma-separated list, and the vocabulary is
    # exactly `Entry-level | Mid-level | Senior | Manager | Director |
    # Executive`. Anything else 400s (`Lead` does), so do not invent values.
    # `q=software engineer` returns totalCount 300 unfiltered, 274 with
    # `Mid-level,Senior` — the cut is real but small here, because the deeper
    # noise is role families, which `q` already constrains.
    queries:
      - { worldwide: "true", q: "software engineer", seniority: "Mid-level,Senior" }
      - { worldwide: "true", q: "backend engineer", seniority: "Mid-level,Senior" }
      - { worldwide: "true", q: "frontend engineer", seniority: "Mid-level,Senior" }
      - { worldwide: "true", q: "full stack engineer", seniority: "Mid-level,Senior" }
      - { worldwide: "true", q: "machine learning engineer", seniority: "Mid-level,Senior" }
      - { country: "India", q: "software engineer", seniority: "Mid-level,Senior" }
      - { country: "India", q: "backend engineer", seniority: "Mid-level,Senior" }
      - { country: "India", q: "frontend engineer", seniority: "Mid-level,Senior" }
      - { country: "India", q: "full stack engineer", seniority: "Mid-level,Senior" }
      # Founding-engineer roles, and the one pair of queries here that carries
      # NO `seniority`. Verified live: `country=India` returns 15 unfiltered
      # and 11 with `Mid-level,Senior`, and the four it cuts include
      # "Founding Product Engineer" and "MedTech Founding Engineer", both
      # tagged `Executive`. At a seed-stage startup "founding" reads as
      # executive to a tagger, so the param cuts on the very word that makes
      # the row worth fetching. The volume is 15 rows, so letting the local
      # role rule judge them costs almost nothing and stays auditable —
      # "Technical Founder" comes back in this sweep and rule 4 rejects it.
      - { worldwide: "true", q: "founding engineer" }
      - { country: "India", q: "founding engineer" }

  - company: Remotive
    ats: remotive
    careers_url: https://remotive.com/remote-jobs/software-dev
    # Remotive's terms ask for at most ~4 calls/day. The scheduler runs hourly,
    # so the cap is enforced here. Do not lower this.
    min_fetch_interval_minutes: 360

  # Wellfound (ex-AngelList) has no public API and blocks plain HTTP clients,
  # so its adapter renders pages through Firecrawl and reads the Next.js data
  # blob the page ships to itself. Needs FIRECRAWL_API_KEY; without it this
  # source is skipped and the rest of the run is unaffected.
  #
  # `queries` are URL *paths*, not API params:
  #   {role: X, remote: true}   -> /role/r/X          (remote-only feed)
  #   {role: X, location: Y}    -> /role/l/X/Y
  #   {location: Y}             -> /location/Y
  # All three forms are permitted by robots.txt. `/search` is NOT — it is both
  # disallowed and the logged-in personalised feed, so it is never used.
  - company: Wellfound
    ats: wellfound
    careers_url: https://wellfound.com/jobs
    #
    # The role slugs mirror `role.families` in `filters.yaml`. `mobile-engineer`
    # was dropped with the `mobile` family — fetching a feed whose every row the
    # role rule then rejects spends a Firecrawl credit per page to store noise.
    #
    # There is deliberately NO `founding-engineer` slug here, even though the
    # family is enabled in `filters.yaml`. Wellfound has no such role: the URL
    # resolves 200 and then 302s to `/remote`, the entire unfiltered board —
    # 11,695 jobs across 205 pages — so the query would silently spend a credit
    # per page scraping the whole site instead of returning nothing. An
    # unrecognized slug here fails open, not closed. Wellfound's valid role
    # slugs are enumerated in the footer of any listing page; founding-engineer
    # is not among them. Founding roles that name a stack
    # ("Founding Backend Engineer") already arrive via the slugs below.
    queries:
      - { role: software-engineer, remote: true }
      - { role: backend-engineer, remote: true }
      - { role: fullstack-engineer, remote: true }
      - { role: machine-learning-engineer, remote: true }
      - { role: frontend-engineer, remote: true }
      # India-located roles the remote-only feeds miss. Every one is scoped to
      # a role slug (`/role/l/{role}/india`).
      #
      # The bare `{location: india}` sweep that used to sit here is GONE. It
      # returned every posting in India regardless of role, which is how
      # "Part-Time E-commerce Assistant" and "Software Development Intern"
      # entered the DB — the role rule flagged both correctly, but they still
      # cost a Firecrawl credit to fetch and a row to store. Scoping by role
      # means they are never requested.
      - { role: software-engineer, location: india }
      - { role: backend-engineer, location: india }
      - { role: fullstack-engineer, location: india }
      - { role: frontend-engineer, location: india }
      - { role: machine-learning-engineer, location: india }

  # Jobicy — free JSON feed of remote jobs, each tagged with the region it
  # hires from (`jobGeo`). Verified live 2026-09-17.
  #
  # ONE query on purpose. The terms say poll "a few times per day" and "must
  # not exceed once per hour", and `geo=apac` already contains every
  # `geo=anywhere` row (72 vs 47, all 47 included), so a second query would
  # only spend a call. There is no `india` geo; an unknown slug answers 200
  # with an `error` and the adapter fails the source loudly.
  - company: Jobicy
    ats: jobicy
    careers_url: https://jobicy.com/jobs
    min_fetch_interval_minutes: 60
    queries:
      - { count: 200, industry: engineering, geo: apac }

  # The Muse — free JSON API, mostly large employers. Verified live 2026-09-17.
  #
  # Every `location` spelling below was checked against returned rows, because
  # an unknown one fails OPEN: `Bengaluru, India` and `India` silently return
  # the remote set instead of nothing. Pune, Noida and New Delhi also failed to
  # match a single row. Remote rows come back with any location, so
  # "Flexible / Remote" is not listed.
  #
  # Expect a truncated fetch: this totals ~3,370 rows and the API stops at page
  # 99 (2,000 rows), in no date order. The closure sweep is skipped for it.
  # Measured yield from those 2,000: 127 eligible and posted <=30d, of which
  # 10 offer remote work — the rest are India-office roles.
  - company: The Muse
    ats: themuse
    careers_url: https://www.themuse.com/search/
    # Up to 100 calls a sweep (unkeyed limit 500/hour, keyed 12,000/hour).
    min_fetch_interval_minutes: 60
    queries:
      - category: Software Engineering
        level: [Mid Level, Senior Level]
        # Quoted: unquoted, YAML splits "Bangalore, India" at the comma.
        location:
          - "Bangalore, India"
          - "Hyderabad, India"
          - "Chennai, India"
          - "Mumbai, India"
          - "Gurgaon, India"

  # YC jobs — the public ycombinator.com/jobs pages (Work at a Startup itself
  # needs a login). Plain HTTP; the page embeds its data. Verified 2026-09-19.
  #
  # `role` and `location` are URL slugs, and an unknown one FAILS OPEN: YC
  # answers 200 with the default list. The adapter refuses such a page, so a
  # typo fails the source loudly. Valid roles: software-engineer, designer,
  # product-manager, recruiting-hr, sales-manager, marketing, support,
  # operations, science. Valid locations include remote, india,
  # san-francisco, new-york. There is no pagination: remote is ~29 jobs and
  # india ~27, the whole set each.
  #
  # `mode: companies` gets past those caps: hiring companies come from YC's
  # public directory index (its Algolia key is read off /companies each run,
  # never stored), then every open role from each company's /jobs page. 251
  # companies matched India / Fully Remote on 2026-09-19; `YC_COMPANY_BUDGET`
  # caps the pages read per run, so polled at most every 12h.
  - company: Y Combinator
    ats: yc
    careers_url: https://www.ycombinator.com/jobs
    min_fetch_interval_minutes: 720
    queries:
      - { role: software-engineer, location: remote }
      - { role: software-engineer, location: india }
      - { mode: companies, regions: [India, Fully Remote] }

  # Arc.dev — remote jobs with a per-job `requiredCountries`. Plain HTTP; the
  # page embeds its data. Verified 2026-09-19.
  #
  # Each entry is ONE listing page: `category` is a path segment
  # (/remote-jobs/python), the rest are query params. Pages cannot be walked
  # (`?page=` is ignored), so each filter adds only its first 30 Arc jobs + 30
  # external re-posts. These seven gave 35 distinct India/worldwide candidates.
  # Polled at most every 6h out of politeness (robots.txt gives named crawlers
  # a 10s delay). Every sweep is truncated by design, so closure never runs
  # here; the validity pass's "missed last sweep" check covers staleness.
  - company: Arc.dev
    ats: arc
    careers_url: https://arc.dev/remote-jobs
    min_fetch_interval_minutes: 360
    queries:
      - { countries: IN, jobRoles: engineering }
      - { countries: IN, jobRoles: engineering, jobTypes: permanent }
      - { category: python, countries: IN }
      - { category: ai, countries: IN }
      - { category: reactjs, countries: IN }
      - { category: nodejs, countries: IN }
      - { category: typescript, countries: IN }

  # Cutshort — India tech-hiring board, read through the JSON its own listing
  # pages use (/backend-api/webpage/jobs/{hub}). Verified 2026-09-19.
  #
  # `hub` is a listing slug. `remote-jobs` holds ~5,600 jobs, newest first, 50
  # a page; a sweep stops at CUTSHORT_MAX_AGE_DAYS (30d is ~4 pages), so every
  # sweep is truncated and closure never runs. Engineering-only hubs exist
  # (e.g. backend-developer-jobs) but mix in on-site roles.
  - company: Cutshort
    ats: cutshort
    careers_url: https://cutshort.io/jobs/remote-jobs
    min_fetch_interval_minutes: 360
    queries:
      - { hub: remote-jobs }

  # Hirist — India-only tech board, read through its site's API
  # (gladiator.hirist.tech). Verified 2026-09-19.
  #
  # Paced at 10s a request (its robots.txt `Crawl-delay: 10`), so a sweep is
  # several minutes: 4 categories x up to 3 pages, plus up to 20 JD fetches for
  # remote rows with a wanted title. Polled at most every 12h. Categories:
  # 1 backend, 16 software dev / full stack, 14 AI/ML, 2 frontend; also 8
  # DevOps and 15 data. `{ query: "..." }` runs a free-text search instead.
  - company: Hirist
    ats: hirist
    careers_url: https://www.hirist.tech/
    min_fetch_interval_minutes: 720
    queries:
      - { categoryId: 1 }
      - { categoryId: 16 }
      - { categoryId: 14 }
      - { categoryId: 2 }

  # Built In — US-centric board whose `country=IND` filter lists roles open to
  # India. HTML only; cards parsed, JD from each detail page's JSON-LD.
  # Verified 2026-09-19: ~113 India jobs under remote/dev-engineering.
  #
  # `path` is a category path under /jobs. robots.txt disallows `?search=` and
  # facet paths like `/jobs/*mid-level`, so the adapter refuses a `search`
  # query. Deep pages never run dry, so every sweep is truncated.
  - company: Built In
    ats: builtin
    careers_url: https://builtin.com/jobs/remote/dev-engineering
    min_fetch_interval_minutes: 720
    queries:
      - { path: remote/dev-engineering, country: IND }

  # Remote OK — free JSON feed (remoteok.com/api). Verified 2026-09-19.
  #
  # Terms: link back to the Remote OK URL (followed, no nofollow) and name
  # Remote OK as the source; `apply_url` is its URL and the UI credits it.
  # Each `tag` returns its newest ~100 rows with no paging, so every sweep is
  # truncated and closure never runs. An unknown tag returns nothing. A blank
  # `location` is read as a worldwide claim, narrowed by the JD prose.
  - company: Remote OK
    ats: remoteok
    careers_url: https://remoteok.com/remote-dev-jobs
    min_fetch_interval_minutes: 360
    queries:
      - { tag: dev }
      - { tag: engineer }
      - { tag: backend }

  # We Work Remotely — public per-category RSS feeds. Verified 2026-09-19.
  #
  # `category` is the feed slug in /categories/{slug}.rss. The category feeds
  # are uncapped, so closure runs. An unknown slug answers 301 with no body
  # and fails the source. Its "Anywhere in the World" region is on 97% of
  # rows, US-only ones included, so it is narrowed by the posting's
  # headquarters line and prose.
  - company: We Work Remotely
    ats: weworkremotely
    careers_url: https://weworkremotely.com/categories/remote-programming-jobs
    min_fetch_interval_minutes: 360
    queries:
      - { category: remote-full-stack-programming-jobs }
      - { category: remote-back-end-programming-jobs }
      - { category: remote-front-end-programming-jobs }
      - { category: remote-devops-sysadmin-jobs }
      - { category: remote-programming-jobs }

  # RemoteYeah — HTML listing pages per role and country. Verified 2026-09-19.
  #
  # `path` is a RemoteYeah listing slug; `remote-{role}-jobs-in-india` lists
  # roles open to India, worldwide ones included. An unknown slug redirects to
  # the all-roles page, which the adapter detects and fails on. A sweep stops
  # at REMOTEYEAH_MAX_AGE_DAYS, so it is always truncated. Role slugs are in
  # the "jobs in India" footer of remoteyeah.com/remote-jobs-in-india.
  - company: RemoteYeah
    ats: remoteyeah
    careers_url: https://remoteyeah.com/remote-jobs-in-india
    min_fetch_interval_minutes: 720
    queries:
      - { path: remote-software-engineer-jobs-in-india }
      - { path: remote-backend-engineer-jobs-in-india }
      - { path: remote-full-stack-engineer-jobs-in-india }
      - { path: remote-artificial-intelligence-engineer-jobs-in-india }
      - { path: remote-machine-learning-engineer-jobs-in-india }
      - { path: remote-platform-engineer-jobs-in-india }

  # --- Curated ATS: India-friendly, USD-paying, remote-first ---------------
  - company: GitLab
    ats: greenhouse
    token_or_slug: gitlab
    careers_url: https://about.gitlab.com/jobs/
    us_employer: true

  - company: Zapier
    ats: ashby
    token_or_slug: zapier
    careers_url: https://zapier.com/jobs
    us_employer: true

  - company: Turing
    ats: greenhouse
    token_or_slug: turing
    careers_url: https://www.turing.com/careers
    us_employer: true

  - company: Deel
    ats: ashby
    token_or_slug: deel
    careers_url: https://www.deel.com/careers
    us_employer: true

  # Automattic runs its own careers site — no Greenhouse/Lever/Ashby board
  # answers for it (all three 404). It needs the PlaywrightAdapter, which is
  # still a Phase 1 stub, so it stays disabled rather than failing every run.
  - company: Automattic
    ats: playwright
    token_or_slug: automattic
    careers_url: https://automattic.com/work-with-us/
    us_employer: true
    enabled: false

  # --- Pre-eligibility company list (kept for their existing rows) ---------
  # These were the Phase 1 / 2A boards. They are US-centric and mostly fail the
  # India + USD rule, so they no longer run — but their jobs stay in the DB and
  # in the dashboard. Re-enable any of them if you want it swept again.
  - { company: Stripe,     ats: greenhouse, token_or_slug: stripe,     enabled: false, us_employer: true }
  - { company: Anthropic,  ats: greenhouse, token_or_slug: anthropic,  enabled: false, us_employer: true }
  - { company: Databricks, ats: greenhouse, token_or_slug: databricks, enabled: false, us_employer: true }
  - { company: Figma,      ats: greenhouse, token_or_slug: figma,      enabled: false, us_employer: true }
  - { company: Discord,    ats: greenhouse, token_or_slug: discord,    enabled: false, us_employer: true }
  - { company: Airtable,   ats: greenhouse, token_or_slug: airtable,   enabled: false, us_employer: true }
  - { company: Coinbase,   ats: greenhouse, token_or_slug: coinbase,   enabled: false, us_employer: true }
  - { company: Robinhood,  ats: greenhouse, token_or_slug: robinhood,  enabled: false, us_employer: true }
  - { company: Palantir,   ats: lever,      token_or_slug: palantir,   enabled: false, us_employer: true }
  - { company: Spotify,    ats: lever,      token_or_slug: spotify,    enabled: false }
  - { company: OpenAI,     ats: ashby,      token_or_slug: openai,     enabled: false, us_employer: true }
  - { company: Linear,     ats: ashby,      token_or_slug: linear,     enabled: false, us_employer: true }
  - { company: Ramp,       ats: ashby,      token_or_slug: ramp,       enabled: false, us_employer: true }
  - { company: Notion,     ats: ashby,      token_or_slug: notion,     enabled: false, us_employer: true }
  - { company: Cursor,     ats: ashby,      token_or_slug: cursor,     enabled: false, us_employer: true }
