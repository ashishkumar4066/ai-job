# Company list for the aggregator.
#
# Adding a company whose ATS already has an adapter is a config change only —
# no new code. Supported `ats` values: greenhouse | lever | ashby
# (`playwright` is a Phase 1 stub and will error if enabled).
#
# How to find `token_or_slug`:
#   greenhouse -> the token in boards.greenhouse.io/<token> or job-boards.greenhouse.io/<token>
#   lever      -> the slug in jobs.lever.co/<slug>
#   ashby      -> the slug in jobs.ashbyhq.com/<slug>
#
# Every entry below was verified live (job counts as of 2026-08-02).
# Run `python -m scripts.verify_endpoints` to re-check at any time.

companies:
  # --- Greenhouse ---------------------------------------------------------
  - company: Stripe
    ats: greenhouse
    token_or_slug: stripe
    careers_url: https://stripe.com/jobs

  - company: Anthropic
    ats: greenhouse
    token_or_slug: anthropic
    careers_url: https://www.anthropic.com/careers

  - company: Databricks
    ats: greenhouse
    token_or_slug: databricks
    careers_url: https://www.databricks.com/company/careers

