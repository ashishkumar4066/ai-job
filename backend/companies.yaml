# Source list for the aggregator. Two adapter families, one interface.
#
#   A. Aggregator boards (himalayas, remotive) — whole-board feeds that carry
#      candidate-eligibility metadata. No board token; they take `queries`,
#      each entry being one set of API params to sweep.
#   B. Curated ATS (greenhouse, lever, ashby) — one board per company, keyed by
#      `token_or_slug`. Pre-vetted employers that hire from India and pay USD.
#
# How to find `token_or_slug`:
#   greenhouse -> the token in boards.greenhouse.io/<token> or job-boards.greenhouse.io/<token>
#   lever      -> the slug in jobs.lever.co/<slug>
#   ashby      -> the slug in jobs.ashbyhq.com/<slug>
#
# Eligibility inputs the feeds cannot supply:
#   us_employer            -> `is_us_employer` for the pay rule. Set it only
#                             where it is actually true; the filter treats
#                             unknown (unset) differently from false.
#   location_eligibility   -> fallback candidate-eligibility, used ONLY when a
#                             posting's own location strings resolve to nothing.
#
# Every entry below was verified live (job counts as of 2026-08-03).
# Run `python -m scripts.verify_endpoints` to re-check at any time.

companies:
  # --- Aggregator boards (primary discovery) -------------------------------
  - company: Himalayas
    ats: himalayas
    careers_url: https://himalayas.app/jobs
    # Two axes, multiplied out. No single query covers both halves of the
    # location rule (`worldwide=true` returns unrestricted roles, `country=India`
    # returns India-eligible ones), and `q` matches one phrase at a time.
    # Results merge into one board and are de-duplicated by job, so a job
    # matching several queries is stored once.
    #
    # `seniority` is the API-level half of the role filter — entry-level rows
    # are never fetched, so they cost nothing to store or re-score. Verified
    # live: the param accepts a comma-separated list, and the vocabulary is
    # exactly `Entry-level | Mid-level | Senior | Manager | Director |
    # Executive`. Anything else 400s (`Lead` does), so do not invent values.
    # `q=software engineer` returns totalCount 300 unfiltered, 274 with
    # `Mid-level,Senior` — the cut is real but small here, because the deeper
    # noise is role families, which `q` already constrains.
    queries:
      - { worldwide: "true", q: "software engineer", seniority: "Mid-level,Senior" }
      - { worldwide: "true", q: "backend engineer", seniority: "Mid-level,Senior" }
      - { worldwide: "true", q: "frontend engineer", seniority: "Mid-level,Senior" }
      - { worldwide: "true", q: "full stack engineer", seniority: "Mid-level,Senior" }
      - { worldwide: "true", q: "machine learning engineer", seniority: "Mid-level,Senior" }
      - { country: "India", q: "software engineer", seniority: "Mid-level,Senior" }
      - { country: "India", q: "backend engineer", seniority: "Mid-level,Senior" }
      - { country: "India", q: "frontend engineer", seniority: "Mid-level,Senior" }
      - { country: "India", q: "full stack engineer", seniority: "Mid-level,Senior" }

  - company: Remotive
    ats: remotive
    careers_url: https://remotive.com/remote-jobs/software-dev
    # Remotive's terms ask for at most ~4 calls/day. The scheduler runs hourly,
    # so the cap is enforced here. Do not lower this.
    min_fetch_interval_minutes: 360

  # Wellfound (ex-AngelList) has no public API and blocks plain HTTP clients,
  # so its adapter renders pages through Firecrawl and reads the Next.js data
  # blob the page ships to itself. Needs FIRECRAWL_API_KEY; without it this
  # source is skipped and the rest of the run is unaffected.
  #
  # `queries` are URL *paths*, not API params:
  #   {role: X, remote: true}   -> /role/r/X          (remote-only feed)
  #   {role: X, location: Y}    -> /role/l/X/Y
  #   {location: Y}             -> /location/Y
  # All three forms are permitted by robots.txt. `/search` is NOT — it is both
  # disallowed and the logged-in personalised feed, so it is never used.
  - company: Wellfound
    ats: wellfound
    careers_url: https://wellfound.com/jobs
    #
    # The role slugs mirror `role.families` in `filters.yaml`. `mobile-engineer`
    # was dropped with the `mobile` family — fetching a feed whose every row the
    # role rule then rejects spends a Firecrawl credit per page to store noise.
    queries:
      - { role: software-engineer, remote: true }
      - { role: backend-engineer, remote: true }
      - { role: fullstack-engineer, remote: true }
      - { role: machine-learning-engineer, remote: true }
      - { role: frontend-engineer, remote: true }
      # India-located roles the remote-only feeds miss. Every one is scoped to
      # a role slug (`/role/l/{role}/india`).
      #
      # The bare `{location: india}` sweep that used to sit here is GONE. It
      # returned every posting in India regardless of role, which is how
      # "Part-Time E-commerce Assistant" and "Software Development Intern"
      # entered the DB — the role rule flagged both correctly, but they still
      # cost a Firecrawl credit to fetch and a row to store. Scoping by role
      # means they are never requested.
      - { role: software-engineer, location: india }
      - { role: backend-engineer, location: india }
      - { role: fullstack-engineer, location: india }
      - { role: frontend-engineer, location: india }
      - { role: machine-learning-engineer, location: india }

  # --- Curated ATS: India-friendly, USD-paying, remote-first ---------------
  - company: GitLab
    ats: greenhouse
    token_or_slug: gitlab
    careers_url: https://about.gitlab.com/jobs/
    us_employer: true

  - company: Zapier
    ats: ashby
    token_or_slug: zapier
    careers_url: https://zapier.com/jobs
    us_employer: true

  - company: Turing
    ats: greenhouse
    token_or_slug: turing
    careers_url: https://www.turing.com/careers
    us_employer: true

  - company: Deel
    ats: ashby
    token_or_slug: deel
    careers_url: https://www.deel.com/careers
    us_employer: true

  # Automattic runs its own careers site — no Greenhouse/Lever/Ashby board
  # answers for it (all three 404). It needs the PlaywrightAdapter, which is
  # still a Phase 1 stub, so it stays disabled rather than failing every run.
  - company: Automattic
    ats: playwright
    token_or_slug: automattic
    careers_url: https://automattic.com/work-with-us/
    us_employer: true
    enabled: false

  # --- Pre-eligibility company list (kept for their existing rows) ---------
  # These were the Phase 1 / 2A boards. They are US-centric and mostly fail the
  # India + USD rule, so they no longer run — but their jobs stay in the DB and
  # in the dashboard. Re-enable any of them if you want it swept again.
  - { company: Stripe,     ats: greenhouse, token_or_slug: stripe,     enabled: false, us_employer: true }
  - { company: Anthropic,  ats: greenhouse, token_or_slug: anthropic,  enabled: false, us_employer: true }
  - { company: Databricks, ats: greenhouse, token_or_slug: databricks, enabled: false, us_employer: true }
  - { company: Figma,      ats: greenhouse, token_or_slug: figma,      enabled: false, us_employer: true }
  - { company: Discord,    ats: greenhouse, token_or_slug: discord,    enabled: false, us_employer: true }
  - { company: Airtable,   ats: greenhouse, token_or_slug: airtable,   enabled: false, us_employer: true }
  - { company: Coinbase,   ats: greenhouse, token_or_slug: coinbase,   enabled: false, us_employer: true }
  - { company: Robinhood,  ats: greenhouse, token_or_slug: robinhood,  enabled: false, us_employer: true }
  - { company: Palantir,   ats: lever,      token_or_slug: palantir,   enabled: false, us_employer: true }
  - { company: Spotify,    ats: lever,      token_or_slug: spotify,    enabled: false }
  - { company: OpenAI,     ats: ashby,      token_or_slug: openai,     enabled: false, us_employer: true }
  - { company: Linear,     ats: ashby,      token_or_slug: linear,     enabled: false, us_employer: true }
  - { company: Ramp,       ats: ashby,      token_or_slug: ramp,       enabled: false, us_employer: true }
  - { company: Notion,     ats: ashby,      token_or_slug: notion,     enabled: false, us_employer: true }
  - { company: Cursor,     ats: ashby,      token_or_slug: cursor,     enabled: false, us_employer: true }
