# My profile — the thing every job is scored against.
#
# This file is the SOURCE OF TRUTH. The dashboard can edit it, but hand-editing
# here must stay a first-class path: it is the one file in this repo worth
# backing up, and the résumé PDF beside it is not machine-readable.
#
# Extracted from data/Ashish_AI_FullStack_v2.pdf on 2026-09-13 (v1 on
# 2026-09-08). REVIEW IT. Every fit score inherits whatever is wrong here, so a
# mis-read year count or a missing skill silently biases all 741 rows.
#
# Editing this file changes `profile_version` (a hash of the normalized
# content), which invalidates cached match scores. That is deliberate — a score
# computed against last week's résumé must never be displayed as current.

